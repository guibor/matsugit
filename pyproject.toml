[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "folioforge"
version = "0.4.0"
description = "Editable documents and themed slides, published together through Git"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
folioforge = "folioforge.cli:main"

[tool.setuptools.package-data]
folioforge = ["themes/default/*", "templates/*", "editor_assets/*", "runtime/*"]

[tool.setuptools.packages.find]
include = ["folioforge*"]
