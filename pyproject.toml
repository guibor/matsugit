[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matsugit"
version = "0.21.2"
description = "Editable documents and themed slides, published together through Git"
license = {file = "LICENSE"}
authors = [{name = "MDF (guibor)"}]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
charts = ["altair>=5", "vl-convert-python>=1.7", "matplotlib>=3.7"]
lint = ["playwright>=1.40"]
export = ["playwright>=1.40"]

[project.scripts]
matsugit = "matsugit.cli:main"
folioforge = "matsugit.cli:main"

[tool.setuptools.package-data]
matsugit = ["themes/default/*", "templates/*", "editor_assets/*", "runtime/*", "diagram_runtime/*.json", "diagram_runtime/*.mjs"]

[tool.setuptools.packages.find]
include = ["matsugit*", "folioforge*"]
