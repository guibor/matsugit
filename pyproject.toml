[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matsugit"
version = "0.21.6"
description = "Editable documents and themed slides, published together through Git"
license = {file = "LICENSE"}
authors = [{name = "MDF (guibor)"}]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
charts = ["altair==6.2.2; python_version < '3.11'", "altair==6.3.0; python_version >= '3.11'", "vl-convert-python==1.9.0.post1", "matplotlib==3.10.9; python_version < '3.11'", "matplotlib==3.11.2; python_version >= '3.11'"]
lint = ["playwright==1.64.1"]
export = ["playwright==1.64.1"]

[project.scripts]
matsugit = "matsugit.cli:main"
folioforge = "matsugit.cli:main"

[tool.setuptools.package-data]
matsugit = ["themes/default/*", "templates/*", "editor_assets/*", "runtime/*", "runtime/*.gz", "diagram_runtime/*.json", "diagram_runtime/*.mjs", "dependencies/*.txt", "dependencies/*.in", "dependencies/*.md"]

[tool.setuptools.packages.find]
include = ["matsugit*", "folioforge*"]
