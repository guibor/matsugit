# Include explicitly. The runner needs Python 3.10+, Quarto, Node.js 22+ and npm.
# It runs only for an explicitly requested API/web pipeline, not ordinary pushes.
matsugit-pages:
  script:
    - python3 .matsugit-ci/diagrams.py --setup
    - python3 .matsugit-ci/charts.py --setup
    - python3 .matsugit-ci/build.py
  pages:
    publish: __SITE_DIR__
  artifacts:
    paths:
      - __SITE_DIR__
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
