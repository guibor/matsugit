name: matsugit Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: matsugit-pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Prepare isolated chart backend
        run: python3 .matsugit-ci/charts.py --setup
      - name: Render documents before slides, without executing document code
        run: python3 .matsugit-ci/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: __SITE_DIR__
      - uses: actions/deploy-pages@v4
        id: deployment
