<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>matsugit</title><style>/* APP_STYLES */</style></head>
<body>
<main id="app">
  <header>
    <div class="identity"><span id="brand-icon"></span><strong>matsugit</strong><span id="filename">Untitled.md</span><button id="copy-path" title="Copy document path" aria-label="Copy document path" disabled></button><span id="dirty" hidden>*</span></div>
    <div class="actions">
      <button id="compact-markup" title="Use compact structural labels" aria-label="Use compact structural labels" aria-pressed="false"></button>
      <button id="recover" title="Recover workspaces" aria-label="Recover workspaces"></button>
      <button id="insert" title="Insert slide or element" aria-label="Insert slide or element"></button>
      <button id="open" title="Open Markdown file" aria-label="Open Markdown file"></button><input id="file" type="file" accept=".md,.markdown,.qmd,.org" hidden>
      <button id="undo" title="Undo" aria-label="Undo"></button><button id="redo" title="Redo" aria-label="Redo"></button>
      <button id="save" title="Save file" aria-label="Save file" disabled></button>
      <button id="git-sync" title="Sync from Git" aria-label="Sync from Git"></button>
      <button id="download" title="Download or export" aria-label="Download or export"></button>
      <button id="publish" title="Publish document and slides" aria-label="Publish document and slides"></button>
      <button id="present" title="Present document" aria-label="Present document"></button>
    </div>
  </header>
  <nav aria-label="Workspace views">
    <div class="segmented" aria-label="Layout">
      <button data-layout="source" aria-pressed="false">Markdown</button>
      <button data-layout="render" aria-pressed="false">Render</button>
      <button data-layout="split" aria-pressed="true">Split</button>
    </div>
    <div class="segmented" aria-label="Preview format">
      <button data-format="document" aria-pressed="true">Document</button>
      <button data-format="slides" aria-pressed="false">Slides</button>
    </div>
    <div class="render-actions">
      <label for="theme">Theme</label><input id="theme" list="themes" placeholder="Project default" aria-label="Theme" maxlength="80"><datalist id="themes"><option value="default"></datalist>
      <label class="auto"><input id="auto" type="checkbox" checked>Auto</label>
      <label class="auto" title="Follow the current heading between source and preview"><input id="sync" type="checkbox" checked>Sync</label>
      <button id="refresh" title="Render preview" aria-label="Render preview"></button>
    </div>
  </nav>
  <div id="notice" role="status" hidden><span id="notice-text"></span><button id="reload" hidden>Reload file</button></div>
  <div id="recovery-banner" hidden><span id="recovery-message"></span><button id="restore-draft">Restore draft</button><button id="dismiss-recovery">Not now</button></div>
  <div id="workspace" data-layout="split">
    <section id="source-pane" aria-label="Source">
      <div class="source-tools">
        <div class="segmented" aria-label="Editor appearance"><button data-editor="raw" aria-pressed="true">Raw</button><button data-editor="visual" aria-pressed="false">Visual</button></div>
        <div class="segmented outline-depth" role="group" aria-label="Outline depth">
          <button data-depth="0" aria-pressed="true" title="Show all headings and content">All</button>
          <button data-depth="1" aria-pressed="false" title="Show headings through level 1">1</button>
          <button data-depth="2" aria-pressed="false" title="Show headings through level 2">2</button>
          <button data-depth="3" aria-pressed="false" title="Show headings through level 3">3</button>
          <button data-depth="4" aria-pressed="false" title="Show headings through level 4">4</button>
          <button data-depth="5" aria-pressed="false" title="Show headings through level 5">5</button>
          <button data-depth="6" aria-pressed="false" title="Show headings through level 6">6</button>
        </div>
        <button id="edit-table" title="Edit table at cursor" aria-label="Edit table at cursor"></button>
      </div>
      <div id="editor"></div>
    </section>
    <div id="divider" role="separator" aria-label="Resize source and preview" aria-orientation="vertical" tabindex="0" aria-valuenow="50" aria-valuemin="20" aria-valuemax="80"></div>
    <section id="preview-pane" aria-label="Rendered preview">
      <iframe id="preview" title="Document preview" sandbox="allow-scripts allow-downloads" referrerpolicy="no-referrer"></iframe>
      <div id="empty" aria-live="polite"><span id="empty-icon"></span><span id="empty-label">Waiting for preview</span></div>
    </section>
  </div>
  <footer><span id="status" role="status">Connecting</span><span id="recovery-status"></span><span id="location">Ln 1, Col 1</span></footer>
</main>
<div id="action-feedback" role="status" aria-live="polite" hidden></div>
<div id="presentation-controls" hidden aria-label="Presentation controls">
  <button id="present-previous" title="Previous slide" aria-label="Previous slide"></button>
  <span id="present-position" aria-live="polite"></span>
  <button id="present-next" title="Next slide" aria-label="Next slide"></button>
  <button id="present-exit" title="Exit presentation (Escape)" aria-label="Exit presentation"></button>
</div>
<dialog id="recovery-dialog" aria-labelledby="recovery-title"><div class="recovery-heading"><h2 id="recovery-title">Recover workspaces</h2><button id="close-recovery" title="Close" aria-label="Close"></button></div><div id="recovery-items"></div></dialog>
<dialog id="table-dialog" aria-labelledby="table-title">
  <div class="recovery-heading"><h2 id="table-title">Edit table</h2><span id="table-cell" aria-live="polite"></span><button id="table-expand" title="Expand table editor" aria-label="Expand table editor"></button><button id="table-close" title="Close table editor" aria-label="Close table editor"></button></div>
  <div id="table-toolbar" role="toolbar" aria-label="Table formatting"></div>
  <div id="table-content"></div>
  <div class="table-footer"><span id="table-status" role="status"></span><button id="table-download" title="Download table draft" aria-label="Download table draft"></button><button id="table-apply" disabled></button></div>
</dialog>
<dialog id="git-sync-dialog" class="delivery-dialog" aria-labelledby="git-sync-title">
  <div class="recovery-heading"><h2 id="git-sync-title">Sync from Git</h2><button id="close-git-sync" title="Close" aria-label="Close"></button></div>
  <pre id="git-sync-progress" role="status" aria-live="polite"></pre>
  <button id="git-sync-check">Check for updates</button>
  <button id="git-sync-apply" disabled>Pull updates</button>
</dialog>
<dialog id="export-dialog" class="delivery-dialog" aria-labelledby="export-title">
  <div class="recovery-heading"><h2 id="export-title">Export</h2><button id="close-export" title="Close" aria-label="Close"></button></div>
  <label>Format<select id="export-format"><option value="source">Source</option><option value="pptx">PowerPoint (editable)</option><option value="pdf">PDF slides</option><option value="html">Slide HTML</option><option value="zip">ZIP: document, slides and source</option></select></label>
  <label>Destination<select id="export-destination"><option value="download">Download</option><option id="sync-destination" value="sync" disabled>Synced folder (not configured)</option></select></label>
  <small id="export-folder"></small>
  <label id="export-replace-row" class="auto" hidden><input id="export-replace" type="checkbox">Replace existing file, including edits made outside matsugit</label>
  <p id="pptx-warning" hidden>Editable text and tables; charts and diagrams are images. Complex layouts may differ. Review in PowerPoint before sharing.</p>
  <button id="export-run" class="delivery-primary">Export</button>
  <pre id="export-progress" role="status" aria-live="polite"></pre>
</dialog>
<dialog id="publish-dialog" class="delivery-dialog" aria-labelledby="publish-title">
  <div class="recovery-heading"><h2 id="publish-title">Publish</h2><button id="close-publish" title="Close" aria-label="Close"></button></div>
  <div class="target-picker"><label>Target<select id="publish-target"><option value="">Project default</option></select></label><button id="repository-toggle" title="Connect a GitHub or GitLab repository" aria-label="Connect a repository"></button></div>
  <div id="repository-picker" hidden>
    <label>Provider<select id="repository-provider"><option value="github">GitHub</option><option value="gitlab">GitLab</option></select></label>
    <label>Host<input id="repository-host" value="github.com" autocomplete="off"></label>
    <button id="repository-list">List repositories</button><button id="repository-more" hidden>More</button>
    <label>Repository<input id="repository-name" list="repository-options" placeholder="owner/repository" autocomplete="off"></label>
    <datalist id="repository-options"></datalist>
    <button id="repository-connect">Connect checkout</button>
  </div>
  <label>Build<select id="publish-build"><option value="ci">Source to CI</option><option value="local">Rendered outputs</option></select></label>
  <label class="auto"><input id="publish-move" type="checkbox">Move source and assets into target; leave local symlinks</label>
  <button id="publish-review" class="delivery-primary">Review target</button>
  <div id="publish-confirmation" hidden><pre id="publish-plan"></pre>
    <label class="auto"><input type="checkbox" id="publish-deploy">Also request the configured CI deployment</label>
    <button id="publish-confirm" class="delivery-primary">Commit and push</button>
  </div>
  <pre id="publish-progress" role="status" aria-live="polite"></pre>
</dialog>
<script>/* APP_SCRIPT */</script>
</body></html>
