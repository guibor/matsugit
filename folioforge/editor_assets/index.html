<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Folioforge Table Editor</title>
  <link rel="stylesheet" href="editor.css">
  <script type="module" src="editor.js"></script>
</head>
<body>
  <header><div><strong>Folioforge</strong><span class="divider">/</span><span id="name">Table</span></div>
    <div class="commands"><button id="cancel">Cancel</button><button id="save" class="primary">Save and Return</button></div>
  </header>
  <div id="toolbar" role="toolbar" aria-label="Table editing"></div>
  <main><div id="editor" aria-label="Table editor"></div>
    <section id="source-panel" hidden><h2>Markdown source</h2><pre id="source"></pre></section>
  </main>
  <footer><span id="status" role="status">Opening</span><span id="dimensions"></span></footer>
  <dialog id="link-dialog"><form method="dialog"><label for="link-url">Link URL</label><input id="link-url" type="text" autocomplete="off"><div class="commands"><button value="cancel">Cancel</button><button value="apply" class="primary">Apply</button></div></form></dialog>
  <div id="error" role="alert" hidden></div>
</body>
</html>
